name: Windows Build Test
on: [push, pull_request]

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
    
    - uses: haskell-actions/setup@v2
      with:
        ghc-version: '9.4.7'
        cabal-version: '3.10.1.0'
        
    - name: Setup SDL2
      run: |
        Invoke-WebRequest https://www.libsdl.org/release/SDL2-devel-2.28.5-VC.zip -OutFile SDL2.zip
        Invoke-WebRequest https://www.libsdl.org/projects/SDL_image/release/SDL2_image-devel-2.8.0-VC.zip -OutFile SDL2_image.zip
        Expand-Archive SDL2.zip -DestinationPath .
        Expand-Archive SDL2_image.zip -DestinationPath .
        
    - name: Cache cabal store
      uses: actions/cache@v3
      with:
        path: |
          ~/.cabal/store
          dist-newstyle
        key: ${{ runner.os }}-cabal-${{ hashFiles('**/*.cabal') }}
        
    - name: Install dependencies and build
      run: |
        cabal update
        cabal configure --flags="sdl2:-pkgconfig -pkgconfig" `
          --extra-include-dirs="${{ github.workspace }}/SDL2-2.28.5/include" `
          --extra-include-dirs="${{ github.workspace }}/SDL2_image-2.8.0/include" `
          --extra-lib-dirs="${{ github.workspace }}/SDL2-2.28.5/lib/x64" `
          --extra-lib-dirs="${{ github.workspace }}/SDL2_image-2.8.0/lib/x64"
        cabal build
        
    - name: Test
      run: cabal test
